version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      excludes:
        - G115  # int -> int32 при конвертации таймаутов в секунды
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - errcheck
          - gosec
          - unparam
      - path: /sqlc/
        linters:
          - unparam
          - revive
          - unused

formatters:
  enable:
    - gofmt
